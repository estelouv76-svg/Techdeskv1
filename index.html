/* Thème RGB étendu : surfaces et interactions, sans modifier les codes couleur des tickets */
:root{--accent-soft:rgba(52,125,244,.14);--accent-border:rgba(52,125,244,.45);--accent-glow:rgba(52,125,244,.24);--accent-text:#9dc4ff}
.logo{background:var(--accent-soft);color:var(--user-accent)}
.brand strong{color:var(--accent-text)}
.gear:hover,.bell:hover,.gear:focus-visible,.bell:focus-visible{background:var(--accent-soft);outline-color:var(--user-accent)}
.nav{border-top-color:var(--accent-border)}
.nav button.active{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-border)}
.nav button.active .ico{color:var(--user-accent)}
.primary{box-shadow:0 3px 16px var(--accent-glow)}
.secondary:not(.import-label){border-color:var(--accent-border)}
.secondary:hover,.import-label:hover{background:var(--accent-soft);border-color:var(--user-accent)}
input:focus,select:focus,textarea:focus{border-color:var(--user-accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--user-accent)}
.stat{border:1px solid var(--accent-border)}
.stat:hover{box-shadow:0 0 0 1px var(--user-accent)}
.stat b{color:var(--accent-text)}
.panel.theme-highlight{background:linear-gradient(120deg,var(--accent-soft),#1a202c);border:1px solid var(--accent-border)}
.modal{border-color:var(--accent-border)}
.rgb-picker{border-color:var(--accent-border)}
.rgb-preview{box-shadow:0 0 16px var(--accent-glow)}
/* Teinte subtile du thème : surfaces sombres, jamais saturées */
:root{--theme-bg:#0b0e15;--theme-panel:#1a202c;--theme-nav:#171d28;--theme-input:#111925;--theme-modal:#202b3c}
html,body{background:var(--theme-bg);transition:background-color .2s ease}
:root{background:var(--theme-bg)}
.panel:not(.theme-highlight),.bell,.gear{background:var(--theme-panel)}
.nav{background:var(--theme-nav);background:color-mix(in srgb,var(--theme-nav) 93%,transparent)}
input:not([type=range]):not([type=color]),select,textarea,.rgb-picker{background:var(--theme-input)}
.modal{background:var(--theme-modal)}
/* Les cartes des tickets restent identifiables par bâtiment/statut */
/* Les tickets gardent leurs couleurs métiers */
.ticket,.ticket .inner{box-shadow:none}
